name: asoyy
description: "All-in-one productivity app with Calendar, Alarm, Calculator, Password Manager & Finance."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.7.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Calendar
  table_calendar: ^3.1.2

  # Notifications
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4

  # Charts
  fl_chart: ^0.69.0

  # Biometric auth
  local_auth: ^2.3.0
  crypto: ^3.0.5

  # Utilities
  intl: ^0.20.0
  uuid: ^4.5.1
  flutter_timezone: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  generate: false

  assets:
    - assets/font/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/font/Inter_18pt-Thin.ttf
          weight: 100
        - asset: assets/font/Inter_18pt-ExtraLight.ttf
          weight: 200
        - asset: assets/font/Inter_18pt-Light.ttf
          weight: 300
        - asset: assets/font/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/font/Inter_18pt-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/font/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/font/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/font/Inter_18pt-ExtraBold.ttf
          weight: 800
