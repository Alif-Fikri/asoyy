name: asoyy
description: "All-in-one productivity app with Calendar, Alarm, Calculator, Password Manager & Finance."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.7.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Calendar
  table_calendar: ^3.1.2

  # Alarm (iOS + Android — plays sound even in silent mode, vibrates)
  alarm: ^5.0.0

  # Notifications (kept for permission requests)
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4

  # Charts
  fl_chart: ^0.69.0

  # Biometric auth
  local_auth: ^2.3.0
  crypto: ^3.0.5

  # Utilities
  intl: ^0.20.0
  uuid: ^4.5.1
  flutter_timezone: ^5.1.0

  # CSV Export/Import
  share_plus: ^10.0.0
  file_picker: ^8.0.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/vela_logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/images/vela_icon_fg.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter_native_splash:
  color: "#4F46E5"
  image: assets/images/vela_icon_fg.png
  color_dark: "#1E1B4B"
  image_dark: assets/images/vela_icon_fg.png
  android_12:
    image: assets/images/vela_icon_fg.png
    color: "#4F46E5"
    image_dark: assets/images/vela_icon_fg.png
    color_dark: "#1E1B4B"
  ios: true
  android: true

flutter:
  uses-material-design: true
  generate: false

  assets:
    - assets/font/
    - assets/images/
    - assets/audio/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/font/Inter_18pt-Thin.ttf
          weight: 100
        - asset: assets/font/Inter_18pt-ExtraLight.ttf
          weight: 200
        - asset: assets/font/Inter_18pt-Light.ttf
          weight: 300
        - asset: assets/font/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/font/Inter_18pt-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/font/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/font/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/font/Inter_18pt-ExtraBold.ttf
          weight: 800
